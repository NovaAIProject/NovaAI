<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #login-container, #nova-ai {
    width: 350px;
    padding: 30px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  #nova-ai {
    display: none;
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #4a90e2;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #357ab8;
  }
  .toggle {
    text-align: center;
    margin-top: 12px;
    cursor: pointer;
    color: #4a90e2;
  }
</style>
</head>
<body>

<div id="login-container">
  <h2 id="form-title">Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button id="submit-btn">Login</button>
  <div class="toggle" id="toggle-form">Don't have an account? Sign Up</div>
</div>

<div id="nova-ai">
  <h2>Welcome to Nova AI</h2>
  <p>This is the main interface.</p>
  <p>Add your sidebar, chats, and AI features here.</p>
</div>

<script>
  const toggleForm = document.getElementById('toggle-form');
  const formTitle = document.getElementById('form-title');
  const submitBtn = document.getElementById('submit-btn');
  const loginContainer = document.getElementById('login-container');
  const novaAI = document.getElementById('nova-ai');

  let isLogin = true;

  toggleForm.addEventListener('click', () => {
    isLogin = !isLogin;
    formTitle.textContent = isLogin ? 'Login' : 'Sign Up';
    submitBtn.textContent = isLogin ? 'Login' : 'Sign Up';
    toggleForm.textContent = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
  });

  submitBtn.addEventListener('click', () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Please enter both username and password');
      return;
    }

    // Fake login/signup logic
    loginContainer.style.opacity = '0';
    loginContainer.style.transform = 'scale(0.95)';
    setTimeout(() => {
      loginContainer.style.display = 'none';
      novaAI.style.display = 'block';
      novaAI.style.opacity = '0';
      novaAI.style.transform = 'scale(0.95)';
      setTimeout(() => {
        novaAI.style.opacity = '1';
        novaAI.style.transform = 'scale(1)';
      }, 50);
    }, 300);
  });
</script>

</body>
</html>
